[global]
type=global

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; --- Standard UDP SIP template for MicroSIP / Zoiper Softphones (1001-1004) ---
[sip-udp-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw,alaw,g722,opus
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
direct_media=no

; --- WebRTC SIP template for Browser Phone (9001 - sip.js) ---
[webrtc-endpoint](!)
type=endpoint
context=from-internal
disallow=all
allow=opus,ulaw,alaw,g722
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
direct_media=no
ice_support=yes
use_avpf=yes
rtcp_mux=yes
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
media_encryption=dtls

[sip-auth](!)
type=auth
auth_type=userpass
password=alertops

[sip-aor](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0

; Extensions 1001 - 1004 configured for standard SIP (MicroSIP / Zoiper)
[1001](sip-udp-endpoint)
auth=1001
aors=1001
[1001](sip-auth)
username=1001
[1001](sip-aor)

[1002](sip-udp-endpoint)
auth=1002
aors=1002
[1002](sip-auth)
username=1002
[1002](sip-aor)

[1003](sip-udp-endpoint)
auth=1003
aors=1003
[1003](sip-auth)
username=1003
[1003](sip-aor)

[1004](sip-udp-endpoint)
auth=1004
aors=1004
[1004](sip-auth)
username=1004
[1004](sip-aor)

; --- Extension 9001 : Superviseur WebRTC (PhonePage / sip.js) ---
[9001](webrtc-endpoint)
auth=9001
aors=9001
[9001](sip-auth)
username=9001
[9001](sip-aor)


