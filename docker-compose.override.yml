services:

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: alertops-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: alertops-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: alertops-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  adminer:
    image: adminer:latest
    container_name: alertops-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8082}:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: alertops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8083}:8080"
    volumes:
      - ./docker/keycloak/realm-alertops.json:/opt/keycloak/data/import/realm-alertops.json:ro
