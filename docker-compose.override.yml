services:

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: alertops-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: alertops-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: alertops-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  adminer:
    image: adminer:latest
    container_name: alertops-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8082}:8080"

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: alertops-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "${KEYCLOAK_PORT:-8083}:8080"
    volumes:
      - ./docker/keycloak/realm-alertops.json:/opt/keycloak/data/import/realm-alertops.json:ro

  asterisk:
    build: ./docker/asterisk
    image: alertops-asterisk:22
    container_name: alertops-asterisk
    environment:
      ASTERISK_TERMINAL_OPTS: "-n"
    ports:
      - "${ASTERISK_HTTP_PORT:-8088}:8088"
      - "${ASTERISK_TLS_PORT:-8089}:8089"
      - "${ASTERISK_SIP_PORT:-5060}:5060/udp"
      - "${ASTERISK_SIP_TCP_PORT:-5060}:5060/tcp"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./docker/asterisk/config/http.conf:/etc/asterisk/http.conf:ro
      - ./docker/asterisk/config/ari.conf:/etc/asterisk/ari.conf:ro
      - ./docker/asterisk/config/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./docker/asterisk/config/rtp.conf:/etc/asterisk/rtp.conf:ro
      - ./docker/asterisk/config/extensions.conf:/etc/asterisk/extensions.conf:ro
      - ./docker/asterisk/config/logger.conf:/etc/asterisk/logger.conf:ro
      - ./docker/asterisk/sounds:/var/lib/asterisk/sounds/alertops
      - ./docker/asterisk/sounds/recordings:/var/spool/asterisk/recording
      - asterisk-keys:/etc/asterisk/keys
    restart: unless-stopped

volumes:
  asterisk-keys:
