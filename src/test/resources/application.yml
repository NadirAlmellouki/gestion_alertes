spring:
  application:
    name: alert-ops-test
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  flyway:
    enabled: false

  mail:
    host: localhost
    port: 1025

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  cache:
    type: none

logging:
  level:
    FST.MST_RSI.PFA: WARN
    org.springframework.security: WARN

app:
  security:
    test-jwt-secret: test-secret-key-at-least-256-bits-long-for-hs256-algorithm
    claims:
      first-name: given_name
      last-name: family_name
  llm:
    provider: gemini
    gemini:
      api-key: test-key
      model: gemini-2.0-flash
      base-url: http://localhost:9
      timeout-seconds: 2
  business-context:
    source: file
    catalog-path: classpath:business-context/solutions-catalog-test.json
  classification:
    prompt-version: v2-test
  ingestion:
    dynatrace:
      token: test-ingestion-token
  notification:
    email:
      enabled: true
      from: alertops@test.local
    sms:
      enabled: false
  routing:
    escalation:
      enabled: false
  monitoring:
    resolution-check:
      enabled: false
    dynatrace:
      enabled: false
