spring:
  application:
    name: alert-ops
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:alertops}
    username: ${POSTGRES_USER:alertops}
    password: ${POSTGRES_PASSWORD:alertops}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: alertops
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "FST.MST_RSI.PFA.*"

  mail:
    host: localhost
    port: ${MAILPIT_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  cache:
    type: caffeine

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    FST.MST_RSI.PFA: DEBUG
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  llm:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-seconds: 30
  voice:
    tts:
      provider: ${TTS_PROVIDER:elevenlabs}
      elevenlabs:
        api-key: ${ELEVENLABS_API_KEY}
        voice-id: ${ELEVENLABS_VOICE_ID}
        model-id: eleven_multilingual_v2
        base-url: https://api.elevenlabs.io
        timeout-seconds: 30
  business-context:
    source: postgres
  classification:
    prompt-version: v2
  referential:
    excel-path: file:info/referentiel-applicatif-complet-2026-08-04.xlsx
    import-on-startup: false
  ingestion:
    dynatrace:
      token: ${DYNATRACE_INGESTION_TOKEN:dev-ingestion-token}
  notification:
    email:
      enabled: true
      from: ${ALERTOPS_EMAIL_FROM:alertops@localhost}
    sms:
      enabled: true
      app-name: alertops
      event-key: FLASH_NOTIFICATION_EVENT
      event-id: KRAKEN_NOTIFICATION_SENDING
      kafka:
        topic: ${ALERTOPS_SMS_TOPIC:alertops-sms-notifications}
    voip:
      enabled: ${VOIP_ENABLED:true}
      provider: ${VOIP_PROVIDER:asterisk}
      gateway-url: ${VOIP_GATEWAY_URL:http://localhost:8088/api/v1/calls}
      ari-url: ${VOIP_ARI_URL:http://localhost:8088}
      ari-user: ${VOIP_ARI_USER:alertops}
      ari-password: ${VOIP_ARI_PASSWORD:alertops}
      ws-url: ${VOIP_WS_URL:ws://localhost:8088/ws}
      audio-dir: ${VOIP_AUDIO_DIR:docker/asterisk/sounds}
      sip-domain: ${VOIP_SIP_DOMAIN:localhost}
      sip-password: ${VOIP_SIP_PASSWORD:alertops}
      timeout-seconds: 30
      max-attempts: 3
  routing:
    escalation:
      enabled: true
      poll-interval-ms: 30000
      max-active-minutes: 1440
  monitoring:
    resolution-check:
      enabled: true
      initial-delay-seconds: 120
      polling-interval-seconds: 300
      max-duration-minutes: 1440
      max-attempts: 288
      poll-interval-ms: 60000
    dynatrace:
      enabled: false
      base-url: ${DYNATRACE_BASE_URL:}
      api-token: ${DYNATRACE_API_TOKEN:}
      timeout-seconds: 15
