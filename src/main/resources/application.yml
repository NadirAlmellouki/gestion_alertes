spring:
  application:
    name: alert-ops
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:alertops}
    username: ${POSTGRES_USER:alertops}
    password: ${POSTGRES_PASSWORD:alertops}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: localhost:${KAFKA_PORT:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: alertops
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "FST.MST_RSI.PFA.*"

  mail:
    host: localhost
    port: ${MAILPIT_SMTP_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

  cache:
    type: caffeine

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    FST.MST_RSI.PFA: DEBUG
    org.springframework.security: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  llm:
    provider: gemini
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-seconds: 30
  voice:
    tts:
      provider: fake
  business-context:
    source: postgres
  classification:
    prompt-version: v2
  referential:
    excel-path: file:info/referentiel-applicatif-complet-2026-08-04.xlsx
    import-on-startup: false
  ingestion:
    dynatrace:
      token: ${DYNATRACE_INGESTION_TOKEN:dev-ingestion-token}
  notification:
    email:
      enabled: true
      from: ${ALERTOPS_EMAIL_FROM:alertops@localhost}
    sms:
      enabled: true
      app-name: alertops
      event-key: FLASH_NOTIFICATION_EVENT
      event-id: KRAKEN_NOTIFICATION_SENDING
      kafka:
        topic: ${ALERTOPS_SMS_TOPIC:alertops-sms-notifications}
